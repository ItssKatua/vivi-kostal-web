<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - History</title>
    <link rel="preload" as="image" href="../img/cat.png">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <img id="cursor" src="../img/fork.png">
    <script src="../cursor.js"></script>

    
    <a href="javascript:history.back()"><img src="../img/open.png" alt="return" id="animated" class="element return"></a>
    <script src="../back.js"></script>
    <div class="wrapper">
        <div class="history-layout">
            <img src="../img/history.png" class="element history-arch">
            <div id="history-list">
                
            </div>
        </div>
    </div>
    <script src="../cat.js"></script>

    <script>
        async function loadBlogHistory() {
            try {
                const response = await fetch("../../content/blog.json");
                const data = await response.json();

                const list = document.getElementById("history-list");
                list.innerHTML = "";

                data.blogs.pop();
                data.blogs.reverse();

                data.blogs.forEach(blog => {
                    const div = document.createElement("div");
                    div.className = "history-entry";

                    div.innerHTML = `
                        <div class="date">${blog.date}</div>
                        <div class="text">${blog.text}</div>
                    `;

                    list.appendChild(div);
                });
            }
            catch (err) {
                console.error("blog.json caught error: ", err);
            }
        }

        window.onload = loadBlogHistory;
    </script>
</body>
</html>
