<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <link rel="preload" as="image" href="../img/cat.png">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <img id="cursor" src="../img/fork.png">
    <script src="../cursor.js"></script>

    
    <a href="javascript:history.back()"><img src="../img/open.png" alt="return" id="animated" class="element return"></a>
    <script src="../back.js"></script>
    <div class="wrapper">
        <div class="layout">
            <p class="element demon-date" id="date"></p>
            <p class="element demon-text" id="text"></p>
            <a href="blog-history.html" style="width: 10%;"><img src="../img/demon.png" alt="blog history" class="element demon"></a>
        </div>
    </div>
    <script src="../cat.js"></script>
</body>

<script>
    async function loadLatestBlog() {
        try {
            const response = await fetch("../../content/blog.json");
            const data = await response.json();

            const blogs = data.blogs;
            if (!blogs || blogs.length === 0) return;

            const latest = blogs[blogs.length - 1];

            document.getElementById("date").textContent = latest.date;
            document.getElementById("text").textContent = latest.text;
        } 
        catch (err) {
            console.error("blog.json caught error: ", err);
        }
    }

    window.onload = loadLatestBlog;
</script>
</html>
